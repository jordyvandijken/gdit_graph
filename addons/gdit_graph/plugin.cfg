[plugin]
; Name must match _get_plugin_name() in plugin.gd, which is what the editor
; shows in the plugin list (and what AGENTS.md documents).
name="Git Graph"
description="Version-control panel for the Godot editor. It stages, commits, and pushes files from a Source Control dock and shows history in a visual Git Graph tab. Requires the git command-line tool on PATH."
author="jvd"
version="1.0.0"
script="plugin.gd"
icons=["icons/icon.png", "icons/git-icon.svg"]
